server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads maiores (fotos de OS) — igual ao limite da API (20MB)
    client_max_body_size 20m;

    # Proxy da API (.NET) — nome do serviço no docker-compose
    location /api/ {
        proxy_pass http://api:5276;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos servidos pela API (fotos)
    location /uploads/ {
        proxy_pass http://api:5276;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — rotas do Angular
    location / {
        try_files $uri $uri/ /index.html;
    }
}
